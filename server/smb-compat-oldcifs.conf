# Compatibility for the TV's OLD cifs.ko (kernel 4.9, ~2020) talking to a
# modern Samba (4.19) that disables SMB1/NTLMv1 by default.
# The TV's mount cmd is fixed in read-only /vendor (no vers=, no sec=), so
# SAMBA must offer what the old client expects. Put these in the [global]
# section of /etc/samba/smb.conf, then restart smbd.
#
#   [global]
   server min protocol = NT1
   server max protocol = SMB3
   ntlm auth = yes
   lanman auth = no
   client min protocol = NT1
#
# Notes:
# - NT1 (SMB1) is insecure; enable only on a trusted LAN and remove after.
# - If the old client prefers SMB2.0, NT1..SMB3 still covers it.
# - A router DHCP reservation for MAC D4:E2:CC:EC:45:E9 gives the TV an
#   instant lease and shortens the blocking-udhcpc window in run_aurora.sh.
