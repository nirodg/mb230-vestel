# Samba share the MB230 mounts via the /conf/remote.txt hook.
# run_aurora.sh on the TV does:
#   mount -t cifs -o username=USER,password=PASS //<this-PC-ip>/mb230cifs /conf/remotelf
#   /conf/remotelf/aurora.elf        # runs OUR binary directly (isgdb=0)
#
# Drop this into /etc/samba/smb.conf (or /etc/samba/conf.d/ if your distro
# includes it). setup_cifs.sh does this for you. LAN-only, temporary rig.

[mb230cifs]
   path = /srv/mb230cifs
   browseable = yes
   read only = yes
   guest ok = no
   valid users = mb230
   # make the ELF show up executable to the TV's CIFS client
   create mask = 0755
   force create mode = 0755
   directory mask = 0755
   # keep it off the open internet; restrict to your LAN (edit to match)
   hosts allow = 192.168. 10. 172.16. 127.
   hosts deny = 0.0.0.0/0
